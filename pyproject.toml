[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quine-lab"
version = "2.0.0"
description = "A deep laboratory of self-reproducing programs (Quines): classic, multi-language, iterative, Ouroboros chains, generators, and a one-command validator."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "BitCook" }]
keywords = ["quine", "self-replicating", "fixed-point", "kleene", "ouroboros", "esolang"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/bit-cook/Quine"
Documentation = "https://bit-cook.github.io/Quine/"
Repository = "https://github.com/bit-cook/Quine"
Challenges = "https://github.com/bit-cook/Quine/blob/main/CHALLENGES.md"

[tool.black]
line-length = 100
target-version = ["py37"]
extend-exclude = '''
/(
    \.git
  | \.github
  | docs
  | classic/quine_short.py
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests_new"]

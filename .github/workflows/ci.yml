name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install toolchains (C, Rust, Go, Java, Node)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc rustc golang-go default-jdk-headless nodejs

      - name: Validate every Quine (master validator)
        run: python tools/validate_all.py -v

      - name: Unit tests
        run: python -m unittest discover -s tests_new -v

      - name: Lint (flake8, non-blocking)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=100 --statistics

  # The public website is a static site in docs/ and is published by enabling
  # GitHub Pages to serve the `main` branch from the `/docs` folder
  # (Repository Settings -> Pages -> Source: branch `main`, folder `/docs`).
  # No build step is required.

